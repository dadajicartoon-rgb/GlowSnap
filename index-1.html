<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GlowSnap — One Tap Photo Glow</title>
<style>
:root{color-scheme:dark;--bg:#0e1016;--panel:#181b24;--muted:#a6adbd;--accent:#a78bfa;--accent2:#7c6cf2}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(circle at top,#252039,#0e1016 55%);color:#f4f5fb;min-height:100vh;padding:20px}
main{max-width:520px;margin:auto}.brand{display:flex;align-items:center;gap:10px;margin:10px 0 24px}.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#c4b5fd,#7c3aed);display:grid;place-items:center;font-size:22px}.brand h1{font-size:23px;margin:0}.brand small{color:var(--muted)}.card{background:rgba(24,27,36,.92);border:1px solid #303443;border-radius:24px;padding:18px;margin-bottom:14px;box-shadow:0 12px 36px #0003}
.preview{width:100%;min-height:280px;max-height:65vh;display:grid;place-items:center;background:#0c0e13;border:1px dashed #3b4050;border-radius:18px;overflow:hidden}.preview img{max-width:100%;max-height:65vh;display:block}.placeholder{text-align:center;color:var(--muted);padding:30px}.placeholder .icon{font-size:48px;margin-bottom:8px}
button{border:0;border-radius:14px;padding:14px 16px;font-size:15px;font-weight:700;color:#fff;cursor:pointer}.primary{background:linear-gradient(135deg,#a78bfa,#7c6cf2);width:100%;margin-top:12px}.secondary{background:#2b3040}.row{display:flex;gap:10px;margin-top:12px}.row button{flex:1}.controls{display:none;margin-top:14px}.controls label{display:flex;justify-content:space-between;font-size:14px;margin:14px 0 6px;color:#dce0eb}input[type=range]{width:100%;accent-color:#a78bfa}.hint{color:var(--muted);font-size:12px;line-height:1.5;margin-top:14px}input[type=file]{display:none}.badge{display:inline-block;border-radius:30px;background:#29243b;color:#d8caff;font-size:12px;padding:6px 10px;margin-bottom:10px}
</style></head><body><main>
<header class="brand"><div class="logo">✨</div><div><h1>GlowSnap</h1><small>One Tap Photo Glow</small></div></header>
<section class="card"><div class="badge">Natural photo enhancement</div><div class="preview" id="preview"><div class="placeholder"><div class="icon">📷</div><strong>अपनी फोटो चुनें</strong><p>यहाँ आपकी फोटो दिखाई देगी</p></div></div>
<input id="file" type="file" accept="image/*"><button class="primary" id="pick">📁 फोटो चुनें</button><button class="primary" id="glow" disabled>✨ One Tap Glow</button>
<div class="controls" id="controls"><label>Brightness <span id="bval">+8%</span></label><input id="bright" type="range" min="-30" max="40" value="8"><label>Contrast <span id="cval">+5%</span></label><input id="contrast" type="range" min="-20" max="30" value="5"><label>Warmth <span id="wval">+2</span></label><input id="warm" type="range" min="-15" max="15" value="2"></div>
<div class="row"><button class="secondary" id="reset" disabled>Reset</button><button class="secondary" id="save" disabled>⬇ Save Photo</button></div><p class="hint">GlowSnap फोटो की रोशनी और टोन को एडजस्ट करता है। बदलाव आपके डिवाइस पर होते हैं; फोटो कहीं अपलोड नहीं की जाती।</p></section>
</main>
<script>
const file=document.getElementById('file'), preview=document.getElementById('preview'), glow=document.getElementById('glow'), save=document.getElementById('save'), reset=document.getElementById('reset'), controls=document.getElementById('controls');let img=null,originalURL=null,canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');
document.getElementById('pick').onclick=()=>file.click();file.onchange=()=>{if(!file.files[0])return;let url=URL.createObjectURL(file.files[0]);let im=new Image();im.onload=()=>{img=im;originalURL=url;preview.innerHTML='';preview.appendChild(img);img.style.maxWidth='100%';img.style.maxHeight='65vh';glow.disabled=false;save.disabled=false;reset.disabled=false;controls.style.display='block';apply();};im.src=url;};
function apply(){if(!img)return;let b=Number(document.getElementById('bright').value),c=Number(document.getElementById('contrast').value),w=Number(document.getElementById('warm').value);document.getElementById('bval').textContent=(b>=0?'+':'')+b+'%';document.getElementById('cval').textContent=(c>=0?'+':'')+c+'%';document.getElementById('wval').textContent=(w>=0?'+':'')+w;img.style.filter=`brightness(${1+b/100}) contrast(${1+c/100}) sepia(${Math.max(0,w)/100*.12}) hue-rotate(${Math.min(0,w)*1.1}deg)`;}
['bright','contrast','warm'].forEach(id=>document.getElementById(id).oninput=apply);
glow.onclick=()=>{document.getElementById('bright').value=12;document.getElementById('contrast').value=7;document.getElementById('warm').value=2;apply();glow.textContent='✨ Glow Applied';setTimeout(()=>glow.textContent='✨ One Tap Glow',1300);};reset.onclick=()=>{document.getElementById('bright').value=0;document.getElementById('contrast').value=0;document.getElementById('warm').value=0;apply();};
save.onclick=()=>{if(!img)return;canvas.width=img.naturalWidth;canvas.height=img.naturalHeight;let b=Number(document.getElementById('bright').value),c=Number(document.getElementById('contrast').value),w=Number(document.getElementById('warm').value);ctx.filter=`brightness(${1+b/100}) contrast(${1+c/100}) sepia(${Math.max(0,w)/100*.12}) hue-rotate(${Math.min(0,w)*1.1}deg)`;ctx.drawImage(img,0,0);canvas.toBlob(blob=>{let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='GlowSnap-edited.jpg';a.click();URL.revokeObjectURL(a.href);},'image/jpeg',.95);};
</script></body></html>
